services:
  wa-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: chillajar_wa_gateway
    restart: on-failure:5
    ports:
      - "9600:9600"
    environment:
      - NODE_ENV=production
      - PORT=9600
      - WA_SENDER=${WA_SENDER:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - LARAVEL_API_URL=${LARAVEL_API_URL:-http://host.docker.internal:9600/api}
      - LARAVEL_WEBHOOK_URL=${LARAVEL_WEBHOOK_URL:-http://host.docker.internal:9600/api/webhook/whatsapp}
      - LARAVEL_API_KEY=${LARAVEL_API_KEY:-}
      - WA_API_KEY=${WA_API_KEY:-}
    volumes:
      - wa_auth_local:/app/auth_info_baileys
      - wa_logs_local:/app/logs
    networks:
      - wa-network
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9600/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  wa-network:
    driver: bridge

volumes:
  wa_auth_local:
    driver: local
  wa_logs_local:
    driver: local
